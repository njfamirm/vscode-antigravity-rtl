<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0f1a"/>
      <stop offset="1" stop-color="#161032"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4facfe"/>
      <stop offset="1" stop-color="#a66cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a66cff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a66cff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="980" cy="320" r="360" fill="url(#glow)"/>
  <circle cx="160" cy="560" r="220" fill="url(#glow)" opacity="0.6"/>

  <!-- Left: title -->
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="80" y="150" fill="#8b93a7" font-size="22" letter-spacing="4">VS CODE · GOOGLE ANTIGRAVITY</text>
    <text x="80" y="250" fill="#ffffff" font-size="88" font-weight="800">Antigravity</text>
    <text x="80" y="345" fill="url(#accent)" font-size="88" font-weight="800">speaks RTL</text>
    <text x="80" y="410" fill="#c4c9d6" font-size="26">Persian &amp; Arabic in the agent chat.</text>
    <text x="80" y="446" fill="#c4c9d6" font-size="26">Right-to-left, Vazirmatn font, code stays LTR.</text>

    <rect x="80" y="500" width="430" height="56" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.15"/>
    <text x="104" y="536" fill="#4facfe" font-family="JetBrains Mono, Consolas, monospace" font-size="20">$</text>
    <text x="128" y="536" fill="#e6e9f0" font-family="JetBrains Mono, Consolas, monospace" font-size="20">curl … install.sh | bash</text>
  </g>

  <!-- Right: chat mock -->
  <g transform="translate(700 110)">
    <rect width="500" height="420" rx="20" fill="#11151f" stroke="#ffffff" stroke-opacity="0.1"/>
    <circle cx="28" cy="28" r="6" fill="#ff5f57"/>
    <circle cx="48" cy="28" r="6" fill="#febc2e"/>
    <circle cx="68" cy="28" r="6" fill="#28c840"/>
    <text x="250" y="33" text-anchor="middle" fill="#8b93a7" font-family="Inter, Segoe UI, sans-serif" font-size="15">Agent</text>

    <!-- user bubble -->
    <rect x="150" y="70" width="320" height="56" rx="14" fill="url(#accent)"/>
    <text x="450" y="105" text-anchor="start" direction="rtl" fill="#ffffff" font-family="Vazirmatn, Tahoma, sans-serif" font-size="19">یه API لاگین با JWT بساز</text>

    <!-- agent reply -->
    <g font-family="Vazirmatn, Tahoma, sans-serif" font-size="18" fill="#e6e9f0">
      <text x="470" y="170" text-anchor="start" direction="rtl">حتماً! سه مرحله داریم:</text>
      <text x="470" y="206" text-anchor="start" direction="rtl" fill="#c4c9d6">• نصب پکیج jsonwebtoken</text>
      <text x="470" y="240" text-anchor="start" direction="rtl" fill="#c4c9d6">• ساخت توکن بعد از لاگین</text>
      <text x="470" y="274" text-anchor="start" direction="rtl" fill="#c4c9d6">• میدلور برای چک کردن توکن</text>
    </g>

    <!-- code block stays LTR -->
    <rect x="30" y="300" width="440" height="90" rx="10" fill="#0b0e15" stroke="#ffffff" stroke-opacity="0.08"/>
    <g font-family="JetBrains Mono, Consolas, monospace" font-size="15">
      <text x="50" y="335" xml:space="preserve"><tspan fill="#a66cff">const</tspan><tspan fill="#e6e9f0"> token = jwt.</tspan><tspan fill="#4facfe">sign</tspan><tspan fill="#e6e9f0">(user, KEY);</tspan></text>
      <text x="50" y="365" fill="#5c6478">// code stays left-to-right</text>
    </g>
  </g>
</svg>
